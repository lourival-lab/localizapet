<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AJUDE UM PET PERDIDO</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  
  <!-- Favicon usando a logo do Cloudinary -->
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dnjtzhd3z/image/upload/f_png/v1779476116/logo_bn4yo4.png"/>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #E8F5E9;
      margin: 0;
      padding: 0;
    }
    header {
      background: #C8E6C9;
      color: #2E7D32;
      padding: 0px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    header img {
      height: 60px; 
      background: transparent;
      display: block;
      margin: 0;
      padding: 0;
    }
    nav {
      text-align: center;
      padding: 10px;
      background: #2E7D32;
    }
    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
      
    }
    #map {
      height: 80vh;
      width: 100%;
    }
    .pet-icon {
      border-radius: 50%;
      border: 2px solid #2E7D32;
      background-color: white;
    }
.logo-titulo {
  display: flex;
  align-items: center;   /* alinha verticalmente logo e texto */
  justify-content: center;
  gap: 15px;             /* espaço entre logo e texto */
}

.logo-titulo img {
  height: 80px;          /* ajusta tamanho da logo */
}

.texto h1 {
  margin: 0;
  padding: 0;
  font-size: 22px;
  font-weight: bold;
  line-height: 1.2;
}

.subtitulo {
  font-family: Verdana;
  margin-top: 0px;
  margin: 0px;
  padding: 0;
  font-size: 16px;
  color: #2E7D32;
  font-style: italic;
  line-height: 1.2;
}
    .status-red { border: 2px solid red !important; }
    .status-green { border: 2px solid green !important; }
    .status-yellow { border: 2px solid gold !important; }
  </style>
</head>
<body>
   <header>
  <div class="logo-titulo">
    <img src="https://res.cloudinary.com/dnjtzhd3z/image/upload/f_png/v1779476116/logo_bn4yo4.png" alt="Logo">
    <div class="texto">
      <h1>AJUDE UM PET PERDIDO</h1>
      <p class="subtitulo">&nbsp;Porque eles precisam de nós!</p>
    </div>
  </div>
</header>
  <nav>
    <a href="index.html">Início</a>
    <a href="lista.html">Lista</a>
    <a href="cadastro.html">Cadastrar Pet</a>
    <a href="sobre.html">Sobre</a>
  </nav>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const API_URL = window.location.hostname === "localhost"
      ? "http://localhost:3000"
      : "https://pets-server-8yxb.onrender.com";

    const map = L.map('map').setView([-15.89, -52.25], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    async function carregarPets() {
      try {
        const res = await fetch(`${API_URL}/pets`);
        if (!res.ok) throw new Error("Erro ao buscar pets");
        const pets = await res.json();

        pets.forEach(pet => {
          if (pet.latitude && pet.longitude) {
            // ✅ Correção: usar direto o link do Cloudinary
            const fotoUrl = pet.foto_url
              ? pet.foto_url
              : "img/pet-default.png";

            let statusClass = "";
            if (pet.status === "Perdido") {
              statusClass = "status-red";
            } else if (pet.status === "Encontrado") {
              statusClass = "status-green";
            } else if (pet.status === "Visto") {
              statusClass = "status-yellow";
            }

            const petIcon = L.icon({
              iconUrl: fotoUrl,
              iconSize: [50, 50],
              className: `pet-icon ${statusClass}`
            });

            const marker = L.marker([pet.latitude, pet.longitude], { icon: petIcon }).addTo(map);

            marker.bindPopup(`
              <b>${pet.nome || "Sem nome"}</b><br>
              ${pet.tipo || "Não informado"}<br>
              Status: ${pet.status || "Não informado"}<br>
              <img src="${fotoUrl}" width="100"><br>
              <a href="detalhe.html?id=${pet.id}">Ver detalhes</a>
            `);
          }
        });
      } catch (err) {
        console.error("Erro ao carregar pets:", err);
      }
    }

    carregarPets();
  </script>
</body>
</html>
